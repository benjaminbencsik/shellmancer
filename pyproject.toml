[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellmancer"
version = "0.1.0"
description = "A local-LLM terminal agent that can execute arbitrary shell commands."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.32.0",
]

[project.scripts]
shellmancer = "shellmancer.cli:main"
sm = "shellmancer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
